name: checks

# Runs on every pull request and on pushes to main. The pull_request run is the
# one that gates merging once branch protection is turned on (see CONTRIBUTING.md).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write   # the audit step reports as a check run

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so we can diff against the base branch

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Build (Cargo.lock must be current)
        run: cargo build --workspace --locked

      - name: Polylith check (brick boundaries and interfaces)
        run: cargo poly check

      - name: Tests (unit, interface and doc examples)
        run: cargo test --workspace --locked

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: ADR front matter lint
        run: cargo poly adr lint

      - name: Spec and queue lint
        run: cargo poly spec lint

      - name: Interface change must be recorded
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch origin "$BASE_REF" || true
          cargo poly interface --mode ci

      - name: Known vulnerabilities in dependencies (cargo audit)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
